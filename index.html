<html>
    <head>
        <meta name="viewport" content="width=device-width,
            initial-scale=1.0, maximum-scale=1, user-scalable=no">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="main-container">
            <!-- Pace Converter -->
            <div class="conversion-container" data-from-unit="km">
                <div class="converted-label">
                    <span class="from-unit-label">km/min</span>
                    <button class="swap-btn" title="Swap units">⇄</button>
                </div>
                <div>
                    <input type="number" min="0" max="59" class="mins" /> :
                    <input type="number" min="0" max="59" class="secs" />
                    <button class="calculate pace">calculate</button>
                </div>
                <div class="conversion-result">
                    <div class="converted-label to-unit-label">miles/min</div>
                    <div class="converted-value">-</div>
                </div>
            </div>

            <!-- Distance Converter -->
            <div class="conversion-container" data-from-unit="km">
                <div class="converted-label">
                    <span class="from-unit-label">km</span>
                    <button class="swap-btn" title="Swap units">⇄</button>
                </div>
                <div>
                    <input type="number" min="0" class="dist large" />
                    <button class="calculate dist">calculate</button>
                </div>
                <div class="conversion-result">
                    <div class="converted-label to-unit-label">miles</div>
                    <div class="converted-value">-</div>
                </div>
            </div>

            <!-- Pace Averager Section -->
            <div class="averager-section">
                <div class="averager-container">
                    <div class="averager-title">Average Pace</div>
                    <div class="averager-inputs">
                        <div class="pace-input-row">
                            <label>Pace 1:</label>
                            <input type="number" min="0" max="99" class="avg-mins-1" placeholder="MM" /> :
                            <input type="number" min="0" max="59" class="avg-secs-1" placeholder="SS" />
                        </div>
                        <div class="pace-input-row">
                            <label>Pace 2:</label>
                            <input type="number" min="0" max="99" class="avg-mins-2" placeholder="MM" /> :
                            <input type="number" min="0" max="59" class="avg-secs-2" placeholder="SS" />
                        </div>
                    </div>
                    <button class="calculate-btn avg-calculate-btn">Calculate</button>
                    <button class="clear-btn avg-clear-btn">Clear</button>
                    <div class="calculator-result">
                        <div class="result-label">Average:</div>
                        <div class="result-value avg-result-value">-</div>
                    </div>
                </div>
            </div>

            <!-- Pace Calculator Section -->
            <div class="calculator-section">
                <div class="calculator-container">
                    <div class="calculator-title">Pace Calculator</div>

                    <!-- Dropdown to select calculation mode -->
                    <div class="calculator-mode">
                        <label>Calculate:</label>
                        <select id="calc-mode">
                            <option value="time">Time</option>
                            <option value="distance">Distance</option>
                            <option value="pace">Pace</option>
                        </select>
                    </div>

                    <!-- Input fields (dynamically shown/hidden) -->
                    <div class="calculator-inputs">
                        <!-- Unit selector (always visible) -->
                        <div class="input-group unit-selector-group">
                            <label>Unit:</label>
                            <div class="unit-selector">
                                <label><input type="radio" name="distance-unit" value="metric" checked> km</label>
                                <label><input type="radio" name="distance-unit" value="imperial"> miles</label>
                            </div>
                        </div>

                        <!-- Time input group -->
                        <div class="input-group time-input-group hidden">
                            <label>Time:</label>
                            <input type="number" id="time-hours" min="0" max="99" placeholder="HH"> :
                            <input type="number" id="time-mins" min="0" max="59" placeholder="MM"> :
                            <input type="number" id="time-secs" min="0" max="59" placeholder="SS">
                        </div>

                        <!-- Distance input group -->
                        <div class="input-group distance-input-group hidden">
                            <label>Distance:</label>
                            <input type="number" id="distance-input" min="0" step="0.01" class="large">
                        </div>

                        <!-- Pace input group -->
                        <div class="input-group pace-input-group hidden">
                            <label>Pace:</label>
                            <input type="number" id="pace-mins" min="0" max="99" placeholder="MM"> :
                            <input type="number" id="pace-secs" min="0" max="59" placeholder="SS">
                            <span id="pace-unit-label">min/km</span>
                        </div>
                    </div>

                    <!-- Calculate and Clear buttons -->
                    <button class="calculate-btn">Calculate</button>
                    <button class="clear-btn">Clear</button>

                    <!-- Result display -->
                    <div class="calculator-result">
                        <div class="result-label">Result:</div>
                        <div class="result-value">-</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Theme toggle button -->
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <span class="theme-icon">🌙</span>
        </button>
    </body>

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous">
    </script>
    <script src="script.js"></script>
</html>
